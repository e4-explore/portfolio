<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><style>text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C8088"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C4825A"/></marker></defs><rect width="1600" height="900" fill="#F2F2EF"/><text x="100" y="202" font-size="38" fill="#2E3135" font-weight="700" text-anchor="start">Alpha cohort</text><text x="100" y="248" font-size="28" fill="#7C8088" font-weight="400" text-anchor="start">150 parents</text><rect x="560" y="150" width="900" height="120" rx="16" fill="#E6E6E1"/><rect x="560" y="150" width="900.0" height="120" rx="16" fill="#B9BCB6"/><text x="1484.0" y="226" font-size="44" fill="#2E3135" font-weight="700" text-anchor="start">150</text><text x="100" y="392" font-size="38" fill="#2E3135" font-weight="700" text-anchor="start">Engaged</text><text x="100" y="438" font-size="28" fill="#7C8088" font-weight="400" text-anchor="start">Opened it at least once</text><rect x="560" y="340" width="900" height="120" rx="16" fill="#E6E6E1"/><rect x="560" y="340" width="360.0" height="120" rx="16" fill="#B9BCB6"/><text x="944.0" y="416" font-size="44" fill="#2E3135" font-weight="700" text-anchor="start">~40%</text><text x="100" y="582" font-size="38" fill="#2E3135" font-weight="700" text-anchor="start">Reached an event page</text><text x="100" y="628" font-size="28" fill="#7C8088" font-weight="400" text-anchor="start">Found the core experience</text><rect x="560" y="530" width="900" height="120" rx="16" fill="#E6E6E1"/><rect x="560" y="530" width="54.0" height="120" rx="16" fill="#C4825A"/><text x="638.0" y="606" font-size="44" fill="#2E3135" font-weight="700" text-anchor="start">~6%</text><text x="800" y="596" font-size="32" fill="#C4825A" font-weight="700" text-anchor="start">← Discovery gap: most never found it</text><text x="560" y="700" font-size="30" fill="#2E3135" font-weight="500" text-anchor="start">→ 90% of these went on to watch video</text><text x="100" y="800" font-size="32" fill="#7C8088" font-weight="400" text-anchor="start">The product converted once parents found it. The problem was activation, not retention.</text></svg>