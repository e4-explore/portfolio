<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><style>text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C8088"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C4825A"/></marker></defs><rect width="1600" height="900" fill="#F2F2EF"/><text x="100" y="120" font-size="36" fill="#2E3135" font-weight="700" text-anchor="start">Typical research loop</text><text x="1500" y="120" font-size="32" fill="#7C8088" font-weight="400" text-anchor="end">Days to weeks</text><rect x="100" y="160" width="300" height="110" rx="22" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="250" y="228" font-size="32" fill="#7C8088" font-weight="500" text-anchor="middle">Feedback</text><line x1="410" y1="215" x2="450" y2="215" stroke="#7C8088" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="460" y="160" width="300" height="110" rx="22" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="610" y="228" font-size="32" fill="#7C8088" font-weight="500" text-anchor="middle">Redesign</text><line x1="770" y1="215" x2="810" y2="215" stroke="#7C8088" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="820" y="160" width="300" height="110" rx="22" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="970" y="228" font-size="32" fill="#7C8088" font-weight="500" text-anchor="middle">Book a session</text><line x1="1130" y1="215" x2="1170" y2="215" stroke="#7C8088" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1180" y="160" width="300" height="110" rx="22" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="1330" y="228" font-size="32" fill="#7C8088" font-weight="500" text-anchor="middle">Validate</text><line x1="100" y1="370" x2="1500" y2="370" stroke="#D6D6D1" stroke-width="2" stroke-dasharray="6 10"/><text x="100" y="460" font-size="36" fill="#2E3135" font-weight="700" text-anchor="start">Live, on the call</text><text x="1500" y="460" font-size="32" fill="#C4825A" font-weight="600" text-anchor="end">Minutes — repeated in one call</text><rect x="180" y="520" width="360" height="120" rx="60" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="360" y="592" font-size="32" fill="#2E3135" font-weight="600" text-anchor="middle">Parent gives feedback</text><line x1="550" y1="580" x2="610" y2="580" stroke="#C4825A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrA)"/><rect x="620" y="520" width="360" height="120" rx="60" fill="#EED9CB" stroke="#C4825A" stroke-width="3"/><text x="800" y="592" font-size="32" fill="#2E3135" font-weight="600" text-anchor="middle">Prototype updated live</text><line x1="990" y1="580" x2="1050" y2="580" stroke="#C4825A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrA)"/><rect x="1060" y="520" width="360" height="120" rx="60" fill="#FFFFFF" stroke="#D6D6D1" stroke-width="2"/><text x="1240" y="592" font-size="32" fill="#2E3135" font-weight="600" text-anchor="middle">Parent reacts</text><path d="M1240 650 C1240 800 360 800 360 662" fill="none" stroke="#C4825A" stroke-width="4" marker-end="url(#arrA)"/><text x="800" y="815" font-size="30" fill="#7C8088" font-weight="400" text-anchor="middle">Repeated several times in a single call</text></svg>